[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
bytes = "1.12.1"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fuse-backend-rs = { version = "0.14.0", default-features = false, features = ["vhost-user-fs"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "http1", "client-legacy"] }
imago = "0.2.5"
libc = "0.2"
mimalloc = "0.1.52"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "serde", "json"] }
nix = { version = "0.31.3", features = ["fs", "hostname", "inotify", "ioctl", "mount", "process", "pthread", "resource", "signal", "socket", "term", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-vsock = "0.7.2"
toml = "1.1.6"
tower = "0.5.3"
ulid = "3.0.0"
ureq = "3.4.2"
vhost = { version = "0.15", features = ["vhost-user-backend"] }
vhost-user-backend = "0.21"
virtio-bindings = "0.2"
virtio-queue = "0.17"
vm-memory = { version = "=0.17.1", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.15"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

toby-api = { path = "crates/toby-api" }
toby-config = { path = "crates/toby-config" }
toby-daemon = { path = "crates/toby-daemon" }
toby-engine = { path = "crates/toby-engine" }
toby-fs = { path = "crates/toby-fs" }
toby-guest = { path = "crates/toby-guest" }
toby-machine = { path = "crates/toby-machine" }
toby-proto = { path = "crates/toby-proto" }
toby-proxy = { path = "crates/toby-proxy" }
toby-store = { path = "crates/toby-store" }
toby-svc = { path = "crates/toby-svc" }
toby-term = { path = "crates/toby-term" }
toby-tools = { path = "crates/toby-tools" }
toby-vfs = { path = "crates/toby-vfs" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
